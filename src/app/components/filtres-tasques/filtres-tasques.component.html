<h2>Filtrar tasques</h2>

<form
  #formulari="ngForm"
  class="filtres"
  (ngSubmit)="aplicar(formulari)"
>
  <div class="camp">
    <label for="text-cerca">Text de cerca</label>

    <input
      id="text-cerca"
      name="text"
      type="text"
      [(ngModel)]="text"
      #cerca="ngModel"
      required
      minlength="3"
      aria-describedby="ajuda-cerca error-cerca"
      [attr.aria-invalid]="
        (cerca.dirty || cerca.touched || formulari.submitted)
        && (cerca.invalid || !cercaValida)
      "
    />

    <p id="ajuda-cerca" class="ajuda">
      Escriu almenys 3 caràcters per cercar.
    </p>

    <div id="error-cerca" class="error" role="alert">
      @if (
        (cerca.dirty || cerca.touched || formulari.submitted)
        && (cerca.invalid || !cercaValida)
      ) {
        @if (cerca.hasError('required')) {
          El text de cerca és obligatori.
        } @else {
          Escriu com a mínim 3 caràcters.
        }
      }
    </div>
  </div>

  <div class="camp">
    <label for="categoria-cerca">Categoria</label>

    <select
      id="categoria-cerca"
      name="categoria"
      [(ngModel)]="categoria"
    >
      <option value="">Totes les categories</option>

      @for (opcio of categories; track opcio) {
        <option [value]="opcio">{{ opcio }}</option>
      }
    </select>
  </div>

  <div class="accions">
    <button
      type="submit"
      [disabled]="formulari.invalid || !cercaValida"
    >
      Aplicar filtres
    </button>

    <button
      type="button"
      class="secundari"
      (click)="restablir(formulari)"
    >
      Restablir
    </button>
  </div>
</form>
