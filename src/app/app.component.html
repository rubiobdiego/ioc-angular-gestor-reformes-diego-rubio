<main class="contenidor">
  <header>
    <h1>{{ nomAplicacio }}</h1>
    <p>
      Diego Alexander Rubio Beltran — Gestió de tasques de reformes.
    </p>
  </header>

  <app-filtres-tasques
    (aplicarFiltres)="aplicarFiltres($event)"
    (restablirFiltres)="restablirFiltres()"
  />

  <section aria-labelledby="titol-tasques">
    <h2 id="titol-tasques">Tasques de la reforma</h2>

    <p role="status">
      @if (tascaSeleccionada) {
        Tasca seleccionada: {{ tascaSeleccionada.titol }}
      } @else {
        Selecciona una tasca per consultar-la.
      }
    </p>

    <app-llista-tasques
      [tasques]="tasquesVisibles"
      [idSeleccionat]="tascaSeleccionada?.id ?? null"
      (seleccionar)="seleccionarTasca($event)"
    />
  </section>
</main>

<router-outlet />
